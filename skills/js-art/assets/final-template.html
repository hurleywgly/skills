<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artwork</title>
<style>
:root{--bg:#0d0f16;--ink:#e8e2d4;--line:#3a3f55}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 ui-sans-serif,system-ui,sans-serif;display:grid;place-items:center}
canvas{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto;aspect-ratio:16/9;background:#efe6d2}
#bar{position:fixed;left:12px;bottom:12px;display:flex;gap:10px;align-items:center;opacity:.85}
button{font:inherit;border:1px solid var(--line);background:rgba(13,15,22,.7);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
#st{letter-spacing:.08em;text-transform:uppercase;font-size:12px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bar"><button id="save">Save PNG</button><span id="st">pulling print…</span></div>
<script>
/*__ENGINE__*/
</script>
<script>
/* piece file must define: INKS, PIECE {fn, seed, name, media?, paper?} and may define SCALE (default 2.4 = 3840×2160).
   Add ?scale=1 to the URL for a fast preview. */
/*__PIECES__*/
</script>
<script>
(async()=>{const cv=document.getElementById('cv'),st=document.getElementById('st'),q=new URLSearchParams(location.search);
  const scale=parseFloat(q.get('scale'))||(typeof SCALE!=='undefined'?SCALE:2.4);document.title=PIECE.name;
  document.getElementById('save').onclick=()=>cv.toBlob(b=>{const a=document.createElement('a');a.download=PIECE.name.toLowerCase().replace(/\s+/g,'-')+'-'+cv.width+'x'+cv.height+'.png';a.href=URL.createObjectURL(b);a.click()},'image/png');
  try{const p=new Print(cv,{seed:PIECE.seed,scale,inks:INKS,paper:PIECE.paper,media:PIECE.media});PIECE.fn(p);await p.finish(t=>st.textContent=t);st.textContent=cv.width+' × '+cv.height}
  catch(err){console.error(err);st.textContent='misprint: '+err.message}
  document.body.dataset.done='1'})();
</script>
</body>
</html>
