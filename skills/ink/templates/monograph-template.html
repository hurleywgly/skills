<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <!-- Monograph Mood: Cormorant Garamond + EB Garamond -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    /* {{BASE_STYLES}} — paste contents of base-styles.css here */

    /* ================================================================
       Monograph Mood Overrides
       Luxury monograph: light on text, heavy on beauty.
       Warm cream palette, Garamond display, generous negative space.
       ================================================================ */

    body.mood-monograph {
      --ink-accent: #B8A48E;
      --ink-accent-light: rgba(184, 164, 142, 0.10);
      --ink-accent-medium: rgba(184, 164, 142, 0.20);
      --ink-text: #1C1A16;
      --ink-text-secondary: #6B5E4E;
      --ink-text-muted: #9E8E7E;
      --ink-surface: #F5F0E8;
      --ink-border: #E8E0D5;
      --ink-border-light: #EDE8E0;
      --ink-dark: #1C1A16;
      --font-primary: 'EB Garamond', Georgia, serif;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --radius-card: 0px;
      --radius-button: 0px;
      --radius-control: 0px;
      --radius-small: 0px;
      --lh-body: 1.72;
      background: #FAFAF8;
      font-variant-ligatures: common-ligatures discretionary-ligatures;
      font-variant-numeric: oldstyle-nums;
    }

    /* Monograph-specific: cover page */
    .cover {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 3in 0 1.5in 0;
      background: #FAFAF8;
      position: relative;
    }

    .cover-eyebrow {
      font-family: var(--font-primary);
      font-variant-caps: all-small-caps;
      letter-spacing: 0.16em;
      font-size: var(--text-caption);
      color: var(--ink-text-muted);
      margin-bottom: var(--space-md);
    }

    .cover-title {
      font-family: var(--font-display);
      font-size: clamp(36pt, 6vw + 1rem, 64pt);
      font-weight: 300;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--ink-text);
      max-width: 80%;
      margin-bottom: var(--space-md);
    }

    .cover-subtitle {
      font-family: var(--font-primary);
      font-size: var(--text-title-3);
      font-weight: 400;
      font-style: italic;
      color: var(--ink-text-secondary);
      max-width: 60%;
      line-height: 1.5;
    }

    .cover-rule {
      height: 1px;
      background: var(--ink-border);
      margin: var(--space-xl) 0;
      width: 100%;
    }

    .cover-meta {
      font-size: var(--text-caption);
      color: var(--ink-text-muted);
      font-variant-numeric: oldstyle-nums;
      line-height: 2;
    }

    /* Full-bleed hero image */
    .hero-spread {
      margin-left: calc(-1 * 1.15in);
      margin-right: calc(-1 * 1.15in);
      width: calc(100% + 2 * 1.15in);
      height: clamp(40vh, 60vh, 80vh);
      overflow: hidden;
      position: relative;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .hero-spread img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .hero-spread-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: var(--space-sm) 1.15in;
      background: linear-gradient(transparent, rgba(28, 26, 22, 0.5));
      color: rgba(250, 250, 248, 0.9);
      font-size: var(--text-caption);
      font-style: italic;
    }

    /* Chapter opener */
    .chapter-opener {
      page: chapter-opener;
      page-break-before: always;
      break-before: page;
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: var(--space-xl) 0;
      border-bottom: 1px solid var(--ink-border);
      margin-bottom: var(--space-xl);
    }

    .chapter-label {
      font-family: var(--font-primary);
      font-variant-caps: all-small-caps;
      letter-spacing: 0.14em;
      font-size: var(--text-caption);
      color: var(--ink-accent);
      margin-bottom: var(--space-sm);
    }

    .chapter-title {
      font-family: var(--font-display);
      font-size: clamp(28pt, 5vw + 0.5rem, 52pt);
      font-weight: 300;
      line-height: 1.1;
      color: var(--ink-text);
      margin-bottom: var(--space-md);
    }

    .chapter-intro {
      font-family: var(--font-primary);
      font-size: var(--text-title-4);
      font-style: italic;
      color: var(--ink-text-secondary);
      max-width: 65ch;
      line-height: 1.55;
    }

    /* Sidenote layout */
    .body-with-margin {
      display: grid;
      grid-template-columns: 1fr min(65ch, 55%) 1fr;
      column-gap: 2.5rem;
    }

    .body-with-margin > * { grid-column: 2; }

    .sidenote {
      grid-column: 3;
      align-self: start;
      font-size: var(--text-caption);
      color: var(--ink-text-muted);
      line-height: var(--lh-tight);
      font-variant-numeric: oldstyle-nums;
      border-left: 1px solid var(--ink-border);
      padding-left: var(--space-xs);
      margin-top: -0.2em;
      font-style: italic;
    }

    /* Editorial pull quote */
    .pull-quote-editorial {
      font-family: var(--font-display);
      font-size: clamp(16pt, 3vw, 26pt);
      font-weight: 300;
      font-style: italic;
      line-height: 1.35;
      color: var(--ink-text);
      text-align: center;
      padding: var(--space-xl) var(--space-xxl);
      margin: var(--space-xl) 0;
      border-top: 1px solid var(--ink-border);
      border-bottom: 1px solid var(--ink-border);
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .pull-quote-editorial::before {
      content: '\201C';
      display: block;
      font-size: 4em;
      line-height: 0.6;
      color: var(--ink-accent);
      margin-bottom: 0.2em;
      font-style: normal;
    }

    /* Drop cap */
    .drop-cap p:first-of-type::first-letter {
      initial-letter: 3;
      font-family: var(--font-display);
      font-weight: 300;
      color: var(--ink-accent);
      margin-right: 0.08em;
      padding-right: 0.04em;
    }

    @supports not (initial-letter: 3) {
      .drop-cap p:first-of-type::first-letter {
        float: left;
        font-size: 4.2em;
        line-height: 0.75;
        margin: 0.08em 0.1em 0 0;
        font-family: var(--font-display);
        color: var(--ink-accent);
      }
    }

    /* Running text */
    .essay-body p {
      font-size: var(--text-body);
      line-height: 1.72;
      color: var(--ink-text);
      margin-bottom: 0;
      font-variant-ligatures: common-ligatures discretionary-ligatures;
      font-variant-numeric: oldstyle-nums;
      hyphens: auto;
      -webkit-hyphens: auto;
    }

    .essay-body p + p {
      text-indent: 1.5em;
    }

    /* Figure + caption */
    figure {
      margin: var(--space-md) 0;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    figure img {
      width: 100%;
      display: block;
    }

    figcaption {
      font-size: var(--text-caption);
      color: var(--ink-text-muted);
      font-style: italic;
      margin-top: var(--space-xs);
      line-height: var(--lh-tight);
      padding-left: var(--space-xs);
      border-left: 1px solid var(--ink-border-light);
      font-variant-numeric: oldstyle-nums;
    }

    /* Horizontal rule divider */
    .rule {
      border: none;
      border-top: 1px solid var(--ink-border);
      margin: var(--space-xl) 0;
    }

    /* Preview bar */
    .preview-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: var(--ink-dark);
      color: white;
      padding: 10px 24px;
      font-size: 11pt;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      font-family: var(--font-primary);
    }

    .preview-bar .preview-label { color: #B8A48E; font-weight: 600; }
    .preview-bar .preview-hint { color: #9E8E7E; }

    @media print {
      .preview-bar { display: none !important; }
      .body-with-margin { display: block; }
      .sidenote {
        display: block;
        font-size: 7.5pt;
        border-left: 1px solid #E8E0D5;
        padding: 4px 8px;
        margin: 8px 0;
      }
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      p, li { orphans: 3; widows: 3; }
    }
  </style>
</head>
<body class="mood-monograph">

  <div class="preview-bar no-print">
    <span><span class="preview-label">Monograph</span> &nbsp;Luxury Monograph Preview</span>
    <span class="preview-hint">Cmd+P &rarr; Save as PDF</span>
  </div>


  <!-- ============================================================
       COVER
       ============================================================ -->
  <div class="cover">
    <div class="cover-eyebrow">{{EYEBROW_LABEL}}</div>
    <h1 class="cover-title">{{TITLE}}</h1>
    <p class="cover-subtitle">{{SUBTITLE}}</p>
    <div class="cover-rule"></div>
    <div class="cover-meta">
      <p>{{AUTHOR}}</p>
      <p>{{DATE}}</p>
    </div>
  </div>


  <!-- ============================================================
       FULL-BLEED HERO SPREAD
       ============================================================ -->
  <div class="hero-spread">
    <img src="{{HERO_IMAGE_SRC}}" alt="{{HERO_IMAGE_ALT}}">
    <div class="hero-spread-caption">{{HERO_CAPTION}}</div>
  </div>


  <!-- ============================================================
       CHAPTER OPENER
       ============================================================ -->
  <section class="chapter-opener">
    <div class="chapter-label">Chapter 01</div>
    <h2 class="chapter-title">{{CHAPTER_1_TITLE}}</h2>
    <p class="chapter-intro">{{CHAPTER_1_INTRO}}</p>
  </section>


  <!-- ============================================================
       BODY WITH SIDENOTE
       ============================================================ -->
  <div class="body-with-margin">
    <div class="essay-body drop-cap">
      <p>{{BODY_PARAGRAPH_1}}</p>
      <p>{{BODY_PARAGRAPH_2}}</p>
      <p>{{BODY_PARAGRAPH_3}}</p>
    </div>
    <aside class="sidenote">
      {{SIDENOTE_TEXT}}
    </aside>
  </div>

  <hr class="rule">


  <!-- ============================================================
       EDITORIAL PULL QUOTE
       ============================================================ -->
  <blockquote class="pull-quote-editorial">
    {{PULL_QUOTE_TEXT}}
  </blockquote>


  <!-- ============================================================
       FIGURE WITH CAPTION
       ============================================================ -->
  <figure>
    <img src="{{FIGURE_IMAGE_SRC}}" alt="{{FIGURE_IMAGE_ALT}}">
    <figcaption>
      <span style="font-variant-caps: all-small-caps; font-style: normal; letter-spacing: 0.08em; margin-right: 6px;">Plate I</span>
      {{FIGURE_CAPTION_TEXT}}
    </figcaption>
  </figure>


</body>
</html>
